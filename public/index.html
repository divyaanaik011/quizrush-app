<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuizRush</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">Live Multiplayer Quiz</div>
    <h1 class="display" style="font-size:40px;">QuizRush</h1>
    <p class="muted" style="text-align:center;">Host a live quiz round, or join one with a room code from your phone.</p>

    <div class="card" style="display:flex; flex-direction:column; gap:14px;">
      <button class="btn-primary" onclick="location.href='host.html'">Host a Quiz</button>
      <button class="btn-secondary" onclick="location.href='player.html'">Join a Quiz</button>
    </div>
  </div>
</body>
</html>
